[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto
markers =
    unit: Testes unitários rápidos
    integration: Testes de integração (podem requerer mocks)
    security: Testes focados em vulnerabilidades
    slow: Testes que demoram mais de 1s
addopts = 
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:reports/coverage
    --cov-fail-under=80

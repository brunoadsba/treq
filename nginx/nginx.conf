events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Import specialized rate limiting zones
    include /etc/nginx/rate-limit.conf;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8002;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Authentication Endpoints (Brute force protection)
        location /api/auth/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            limit_req zone=auth_limit burst=5 nodelay;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Heavy AI/Document Endpoints
        location ~ ^/api/(documents|audio|agent/chat) {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            limit_req zone=heavy_limit burst=5;
            
            # SSE support for agent/chat
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General API Endpoints
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }
    }
}

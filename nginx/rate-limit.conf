# Enterprise Rate Limiting Zones
# 1. Standard API Zone: 10 requests per second, for general operations.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 2. Auth Zone: 1 request per second, very strict for login/auth routes.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

# 3. Heavy Zone: 2 requests per second, for document processing or heavy AI tasks.
limit_req_zone $binary_remote_addr zone=heavy_limit:10m rate=2r/s;
